name: Strict CPA Auto-Generator
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'set rdp password'
        required: true
        default: 'Atay@Bna3na3#2026'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Checkout repository (Fetching bot.py)
        uses: actions/checkout@v3

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Tools (FFmpeg & Rclone)
        run: |
          choco install ffmpeg -y
          choco install rclone -y

      - name: 4. Install Python Libraries
        run: pip install requests praw

      - name: 5. Setup RDP Credentials & Network
        run: |
          net user runneradmin "${{ github.event.inputs.password }}" /y
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: 6. Start Tailscale
        run: |
          invoke-webrequest -uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -outfile 'tailscale.exe'
          start-process -filepath "tailscale.exe" -argumentlist "/quiet" -wait
          start-sleep -seconds 15
          & "c:\program files\tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --hostname=cloud-rdp-server --accept-routes

      - name: 7. Setup Workspace on Desktop
        run: |
          # هاد الكود كيهز الملفات من المسار المخفي وكيحطهم ف سطح المكتب باش يبانو ليك
          $DesktopPath = "C:\Users\runneradmin\Desktop\CPA_Project"
          New-Item -ItemType Directory -Force -Path $DesktopPath
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $DesktopPath -Recurse -Force
          
          # إعداد ملف Rclone الخاص بالتخزين السحابي
          $rcloneDir = "$env:APPDATA\rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir
          Set-Content -Path "$rcloneDir\rclone.conf" -Value '${{ secrets.RCLONE_CONF }}'

      - name: 8. Execute CPA Video Factory & Upload
        run: |
          # الدخول لمجلد سطح المكتب وتشغيل السكريبت
          cd "C:\Users\runneradmin\Desktop\CPA_Project"
          python bot.py
          
          # رفع الفيديوهات إلى Google Drive
          rclone copy ./output_videos mydrive:/CPA_Videos/ -v

      - name: 9. Keep Server Alive (Only if SUCCESS)
        run: |
          echo "=========================================="
          echo "✅ ALL STEPS SUCCEEDED! System is ready."
          echo "username: runneradmin"
          echo "password: ${{ github.event.inputs.password }}"
          echo "internal ip address:"
          & "c:\program files\tailscale\tailscale.exe" ip -4
          echo "=========================================="
          while ($true) {
            start-sleep -seconds 300
          }
