name: Strict CPA Auto-Generator

on:
  workflow_dispatch:
    inputs:
      password:
        description: "set rdp password"
        required: true
        default: "Atay@Bna3na3#2026"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository (Fetching bot.py)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Tools (FFmpeg & Rclone)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install rclone -y --no-progress
          ffmpeg -version
          rclone version

      - name: Install Python Libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install requests praw
          }

      - name: Setup RDP Credentials & Network
        shell: pwsh
        run: |
          net user runneradmin "${{ github.event.inputs.password }}"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

      - name: Start Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TS_KEY }}
        run: |
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile 'tailscale.exe'
          Start-Process -FilePath '.\tailscale.exe' -ArgumentList '/quiet' -Wait
          Start-Sleep -Seconds 15
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$env:TS_KEY" --hostname="cloud-rdp-server" --accept-routes

      - name: Setup Workspace on Desktop
        shell: pwsh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          $DesktopPath = Join-Path $env:USERPROFILE 'Desktop\CPA_Project'
          New-Item -ItemType Directory -Force -Path $DesktopPath | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $DesktopPath -Recurse -Force

          $rcloneDir = Join-Path $env:APPDATA 'rclone'
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null
          Set-Content -Path (Join-Path $rcloneDir 'rclone.conf') -Value $env:RCLONE_CONF -Encoding UTF8

      - name: Execute CPA Video Factory & Upload
        shell: pwsh
        run: |
          $WorkDir = Join-Path $env:USERPROFILE 'Desktop\CPA_Project'
          Set-Location $WorkDir

          if (!(Test-Path "bot.py")) {
            throw "bot.py not found in repository root."
          }

          python bot.py

          if (!(Test-Path ".\output_videos")) {
            throw "output_videos folder was not created."
          }

          rclone copy ".\output_videos" "mydrive:/CPA_Videos/" -v
          if ($LASTEXITCODE -ne 0) {
            throw "rclone upload failed."
          }

      - name: Keep Server Alive (Only if SUCCESS)
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "ALL STEPS SUCCEEDED! System is ready."
          Write-Host "username: runneradmin"
          Write-Host "password: ${{ github.event.inputs.password }}"
          Write-Host "internal ip address:"
          & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
          Write-Host "=========================================="
          while ($true) {
            Start-Sleep -Seconds 300
          }
