name: Strict CPA Auto-Generator

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Set RDP password"
        required: true
        default: "Atay@Bna3na3#2026"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system tools
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install rclone -y --no-progress

          ffmpeg -version
          rclone version

      - name: Install Python libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install requests praw
          }

      - name: Validate project files
        shell: pwsh
        run: |
          if (!(Test-Path "bot.py")) {
            throw "bot.py not found in repository root."
          }

      - name: Prepare workspace
        shell: pwsh
        run: |
          $DesktopPath = Join-Path $env:USERPROFILE "Desktop\CPA_Project"
          New-Item -ItemType Directory -Force -Path $DesktopPath | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $DesktopPath -Recurse -Force

          $rcloneDir = Join-Path $env:APPDATA "rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null

          @"
${{ secrets.RCLONE_CONF }}
"@ | Set-Content -Path (Join-Path $rcloneDir "rclone.conf") -Encoding UTF8

      - name: Run CPA generator
        shell: pwsh
        run: |
          $WorkDir = Join-Path $env:USERPROFILE "Desktop\CPA_Project"
          Set-Location $WorkDir

          if (!(Test-Path "bot.py")) {
            throw "bot.py not found in working directory."
          }

          python bot.py

          if (!(Test-Path ".\output_videos")) {
            throw "output_videos folder was not created."
          }

          $files = Get-ChildItem ".\output_videos" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "output_videos exists but contains no files."
          }

      - name: Upload videos to Google Drive
        shell: pwsh
        run: |
          $rcloneExe = (Get-Command rclone).Source
          if (-not $rcloneExe) {
            throw "rclone is not available in PATH."
          }

          $WorkDir = Join-Path $env:USERPROFILE "Desktop\CPA_Project"
          Set-Location $WorkDir

          rclone copy ".\output_videos" "mydrive:/CPA_Videos/" -v --create-empty-src-dirs

          if ($LASTEXITCODE -ne 0) {
            throw "rclone upload failed."
          }

      - name: Final status
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "ALL STEPS SUCCEEDED."
          Write-Host "=========================================="
